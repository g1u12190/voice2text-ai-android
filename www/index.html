<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Voice2Text AI</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="container">

    <div class="topbar">

        <h1>

            🎤 Voice2Text AI for Whatsapp

        </h1>

        <button
            id="themeBtn"
            class="themeButton">

            🌙

        </button>

    </div>

    <p class="subtitle">

        Dictado inteligente

    </p>

    <div class="statusBox">

        <p id="status">

            Estado: Esperando...

        </p>

        <!--p id="timer">

            ⏱ 00:00

        </p-->

    </div>

    <div class="buttons">

        <button id="startBtn">

            🎙 Iniciar

        </button>

        <button id="continueBtn">
            
            ▶ Continuar
        
        </button>


        <button id="stopBtn">

            ⏹ Detener

        </button>

    </div>

    <textarea

        id="output"

        placeholder="Aquí aparecerá el texto..."

    ></textarea>

    <div class="buttons">

        <button id="copyBtn">

            📋 Copiar

        </button>

        <button id="clearBtn">

            🧹 Limpiar

        </button>

         <button id="improveBtn">
            
            ✨ Mejorar
        
        </button>

    </div>

    <!--div class="autoImprove">

        <label>
            
            <input
            
                type="checkbox"
                id="autoImprove">

            Mejorar automáticamente

        </label>

</div-->

    <!-- ========================================= -->
<!--====================================================-->
<!-- CONTACTOS -->
<!--====================================================-->

<div class="contactsBox">

    <h2>👥 Contactos</h2>

    <input
        type="text"
        id="searchContact"
        placeholder="🔍 Buscar contacto">

    <div class="buttons">

        <button id="newContactBtn">

            ➕ Agregar contacto

        </button>

        <button id="importContactsBtn">

            📥 Importar contactos (.vcf)

        </button>

        <button id="deleteAllBtn">
            
            🗑 Eliminar todos
        
        </button>

    </div>

    <input
    type="file"
    id="vcfFile"
    accept=".vcf"
    style="display:none;">

    <div
        id="contactForm"
        class="contactForm hidden">

        <input
            type="text"
            id="contactName"
            placeholder="Nombre">

        <input
            type="text"
            id="contactAlias"
            placeholder="Alias">

        <input
            type="text"
            id="contactPhone"
            placeholder="Número WhatsApp">

        <label>

            <input
                type="checkbox"
                id="favoriteContact">

            Favorito

        </label>

        <div class="buttons">

            <button id="saveContactBtn">

                💾 Guardar

            </button>

            <button id="cancelContactBtn">

                Cancelar

            </button>

        </div>

    </div>

    <div id="contactsList">

    </div>

</div>

</div>

<!--========================================-->
<!-- MODAL IMPORTAR CONTACTOS -->
<!--========================================-->

<div id="importModal" class="modal hidden">

    <div class="modalContent">

        <h2>📥 Importar contactos</h2>

        <p id="importInfo"></p>

        <div class="buttons">

            <button id="confirmImportBtn">

                ✅ Importar

            </button>

            <button id="cancelImportBtn">

                ❌ Cancelar

            </button>

        </div>

    </div>

</div>

<!--========================================-->
<!-- MODAL CONTACTO DUPLICADO -->
<!--========================================-->

<div id="duplicateModal" class="modal hidden">

    <div class="modalContent">

        <h2>⚠ Contacto existente</h2>

        <p>

            Este número ya existe en tus contactos.

        </p>

        <div id="duplicateInfo"></div>

        <div class="buttons">

            <button id="keepExistingBtn">

                👤 Mantener actual

            </button>

            <button id="replaceNameBtn">

                🔄 Reemplazar nombre

            </button>

        </div>

    </div>

</div>

<!--========================================-->
<!-- CONTACTO SELECCIONADO -->
<!--========================================-->

<div id="selectedContactBox" class="selectedContact hidden">

    <h3>📤 Destinatario</h3>

    <p id="selectedContactName"></p>

    <p id="selectedContactPhone"></p>

    <div class="selectedContactButtons">

        <button id="changeContactBtn">

            ✕ Cambiar

        </button>

        <button id="sendWhatsAppBtn">

            📲 Whatsapp

        </button>

    </div>

</div>

</div>

<script src="js/speech.js"></script>

<script src="js/clipboard.js"></script>

<script src="js/ai.js"></script>

<script src="js/contacts.js"></script>

<script src="js/app.js"></script>

</body>

</html>
